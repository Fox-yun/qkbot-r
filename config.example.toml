# 复制为 config.toml；填写模型后启动，在网页设置管理员密码。
# 群与好友默认开启 Bot，可在管理页分别关闭；开关按登录账号保存到数据库。
# 密钥可放 QKBOT_API_KEY / QKBOT_MILKY_TOKEN / QKBOT_ADMIN_TOKEN / QKBOT_LLBOT_TOKEN 环境变量。
# 网页保存配置不会把环境变量中的密钥写回文件。
# 独立向量密钥可使用 QKBOT_EMBEDDING_API_KEY，不复用聊天模型密钥。

[app]
database = "qkbot.sqlite3"
timezone = "Asia/Shanghai"
log = "info"

[web]
enabled = true
listen = "127.0.0.1:3210"     # 管理页面默认仅监听本机；修改本节需要编辑文件并重启
token = ""                    # 可选首次初始化码，至少32字节；完成密码设置后失效
secure_cookie = false         # HTTPS 反向代理部署设为 true；本机 HTTP 保持 false

[qq_login]
enabled = true
url = "http://127.0.0.1:3080" # LLBot WebUI，用于扫码登录和登录状态
token = ""                    # LLBot WebUI密码，可用QKBOT_LLBOT_TOKEN；与Milky token分别设置

[milky]
url = "http://127.0.0.1:3010" # LLBot常见Milky端口；以协议端实际配置为准
# bot_id = 123456789            # 可选：固定登录账号，防止接错协议端
# access_token = ""
max_response_bytes = 262144
request_timeout_secs = 15

[llm]
chat_completions_url = "https://api.example.com/v1/chat/completions"
model = "your-model"
api_key = ""
tool_calling = true            # 上游不支持原生 tools 时设为 false
vision = true                  # 识别当前触发消息及其引用中的图片，合计最多4张；上游不支持视觉时关闭
max_concurrent_requests = 2
request_timeout_secs = 60
max_response_bytes = 262144

[embedding]
enabled = false               # 开启后为已有有效记忆建立索引；故障时继续使用FTS检索
embeddings_url = "https://api.siliconflow.cn/v1/embeddings"
api_key = ""
model = "Qwen/Qwen3-VL-Embedding-8B"
dimensions = 1024
request_timeout_secs = 15
max_response_bytes = 262144

[stickers]
enabled = true                # 需要启用Embedding；按机器人账号和群隔离
auto_collect = true           # 所有允许服务的群：只自动保存协议明确标为表情的图片
max_per_group = 256
max_group_bytes = 134217728
max_total_bytes = 536870912
max_total_items = 4096
queue_capacity = 32
requests_per_hour = 120
send_cooldown_secs = 60        # 每群间隔；每次最终回复最多发送一张表情

[plugins.ai]
enabled = true
keywords = ["小鱼"]            # 群内真实 @ 或关键词触发；好友私聊直接触发
read_group_background = true   # 已开启 Bot 的群内闲聊可作为短期背景
learn_all_group_messages = false
compact_after_messages = 40
compact_idle_secs = 600
memory_input_budget = 6000
memory_output_budget = 3200
max_memories_per_conversation = 256 # 持久化容量，可按需要提高；不会全量载入上下文
memory_recall_limit = 5        # 每次最多召回的记忆条数，可提高
memory_recall_budget = 1000    # 召回文本预算，最终仍受会话总输入预算约束

[plugins.ai.defaults]
reply_to_bot = true            # 引用回复当前机器人账号的消息时触发 AI；插件命令仍优先
mode = "group"                # group：同群共享；user：同群按用户隔离，回复仍公开
input_budget = 6000
output_budget = 800
recent_messages = 24
persona = "雄小鬼"             # 管理页列表选择；可按会话单独切换
memory_read = true
memory_write = true
summary = true
paused = false
once = false
allowed_tools = ["clock_now", "reply_message", "search_stickers", "reminder_list", "reminder_create", "reminder_cancel"]  # 工具还需启用对应插件；表情需视觉能力

[plugins.ai.personas]
# 内置：雄小鬼、清朗青年、温柔学长、理性搭档、沉稳前辈，无须在这里重复填写。
# 可在管理页查看模板、编辑或另存自定义人设；同名自定义内容优先。

[plugins.clock]
enabled = true

[plugins.reminder]
enabled = false
max_active_per_user = 10
llm_writes_require_confirmation = false  # AI 按用户请求直接创建/取消；设 true 可要求本人再次确认

[plugins.native]
# 群/好友默认可用；管理页可分别关闭某插件。戳一戳、禁言游戏按需勾选。
enabled = ["help", "roll", "checkin", "wordle", "kfc", "meal", "daily_partner", "mc_status", "sticker_save", "mock_chat_image", "mock_forward"]
superusers = []               # QQ号整数；管理食物图片、MC等原插件管理员能力
image_font_path = ""          # 自动寻找系统中文字体，也可指定 Noto Sans CJK 路径
meal_cooldown_secs = 10
meal_daily_limit = 0          # 0 不限制，每天本地时间08:00重置
mute_max_secs = 360
mc_servers = []               # [{name="生存",host="mc.example.com",port=25565,kind="java",group_ids=[123456]}]

[nonebot]
enabled = false              # Python/浏览器仅启用上游插件时需要
listen = "127.0.0.1:3215"    # 同时用于原生图片临时资源；协议端需能访问本机地址
token = ""                   # 独立随机令牌，至少32字节；可用QKBOT_NONEBOT_TOKEN覆盖
task_timeout_secs = 120
queue_capacity = 32
media_dir = "data/plugin-media"
media_max_bytes = 20971520
# 省略 plugins 时自动载入六项已核对预设，均默认关闭，在 Web 勾选。
# 显式 plugins = [] 可清空；完整定义见 sidecar/nonebot/catalog.json。

# 联网搜索默认关闭；密钥可用 QKBOT_SEARCH_API_KEY 覆盖。
# AI 使用需另在 plugins.ai.defaults.allowed_tools 加入 web_search；已有会话单独授权。
[plugins.web_search]
enabled = false
provider = "tavily"
api_key = ""
max_results = 5
request_timeout_secs = 8      # 必须小于 limits.tool_timeout_secs
max_response_bytes = 262144
max_output_bytes = 6144
max_concurrent_requests = 2
max_calls_per_turn = 1
user_per_hour = 10
conversation_per_hour = 30
global_per_hour = 60

[limits]
# 保护队列、成本和超时的运行边界，不是内存达标线；可按实际用途调整。
queued_global = 32
queued_per_conversation = 4
control_tasks = 8
database_queue = 128
active_conversations = 128
max_message_bytes = 16384
turn_timeout_secs = 120
tool_timeout_secs = 15
max_model_calls = 3            # 可提高至 16；实际轮数取本项与 max_http_attempts 的较小值
max_http_attempts = 4          # 可提高至 32；每次模型请求占一次额度
max_tool_calls = 2             # 可提高至 15；最后一个模型请求保留为文本回答
retention_days = 7
send_cooldown_secs = 2
sends_per_hour = 120
model_user_per_hour = 60
model_conversation_per_hour = 180
model_global_per_hour = 600
memory_requests_per_hour = 60 # 后台整理独立额度；工具续轮和失败请求也计入模型额度
